name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      # GitHub runners don't expose /dev/kvm. Tests that need it use
      # `KvmFd::open_or_skip` (cfg-test associated fn in src/kvm/kvm_fd.rs)
      # and skip-pass on access failure — so the suite still runs, just
      # with fewer assertions per test. CI catches:
      #   - compilation regressions
      #   - lints (clippy -D warnings)
      #   - property-based tests (200 random adversarial cases per property)
      #   - pure-validation tests
      # The kernel-boot tests run on the dev host or scheduled runners
      # with KVM access.
      - name: Build (release)
        run: cargo build --release --verbose
      - name: Build (jailer binary)
        run: cargo build --release --bin ingot-jailer
      - name: Unit + property tests
        run: cargo test --quiet
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Rustdoc
        run: cargo doc --no-deps --document-private-items

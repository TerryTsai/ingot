name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      # GitHub runners don't expose /dev/kvm. Tests that need it use
      # `open_or_skip` (see src/kvm/test_helpers.rs) and skip-pass on
      # access failure — so the suite still runs, just with fewer
      # assertions per test. The point of CI here is to catch
      # compilation regressions + lints + the pure-validation tests.
      - name: Build
        run: cargo build --release --verbose
      - name: Unit tests + doctest
        run: cargo test --quiet
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Rustdoc
        run: cargo doc --no-deps --document-private-items

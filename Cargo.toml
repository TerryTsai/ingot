[package]
name = "ingot"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal KVM-based VMM for ephemeral, hardware-isolated microVMs"
publish = false

[dependencies]
libc = "0.2"
kvm-bindings = "0.14"

[dev-dependencies]
# Property-based testing. See docs/decisions/0006-proptest-dev-dep.md.
proptest = "1"
